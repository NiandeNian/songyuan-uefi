#
# Device Status
#
[status]
model_count = 1

#
# Boot Shim Configs
#
[boot_shim]
requires_kernel_header = true
text_offset = 0
image_flags = 0xA

#
# UEFI FD Configs
#
[uefi_fd]
base = 0xA7100000
size = 0x300000

#
# Android Boot Image Kernel Configs
#
[boot_image_kernel]
kernel_compression = "none"
append_dtb         = false

#
# Android Boot Image Configs
#
[boot_image]
# The existing songyuan RAM loader boots as a raw ARM64 Image with Android v4.
# The UEFI menu uses no generic ramdisk; its device tree is embedded in firmware.
header_version = 4
os_version = "17.0.0"
os_patch_level = "2026-11"
